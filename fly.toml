# fly.toml app configuration file generated for ticketmaster-api on 2026-11-15T23:48:39-08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ticketmaster-api'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[deploy]
  release_command = "pnpm prisma migrate deploy"
